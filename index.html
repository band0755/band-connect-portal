<!-- ================================================================= -->
<!-- HANDLE TESTING FORM SECTION                                       -->
<!-- ================================================================= -->
<form id="handleTestingForm" onsubmit="handleFormSubmit(event)">
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" class="form-control" required>
    </div>
    <div class="form-group col-md-6">
      <label for="time">Time</label>
      <input type="time" id="time" name="time" class="form-control" required>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="serialNo">Serial No.</label>
      <input type="text" id="serialNo" name="serialNo" class="form-control" required>
    </div>
    <div class="form-group col-md-6">
      <label for="macId">Device MAC ID</label>
      <input type="text" id="macId" name="macId" class="form-control" required>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="extremity">Extremity</label>
      <select id="extremity" name="extremity" class="form-control" required>
        <option value="">Select Extremity...</option>
        <option value="UPPER">UPPER</option>
        <option value="LOWER">LOWER</option>
      </select>
    </div>
    <div class="form-group col-md-4">
      <label for="side">Side</label>
      <select id="side" name="side" class="form-control" required>
        <option value="">Select Side...</option>
        <option value="LEFT">LEFT</option>
        <option value="RIGHT">RIGHT</option>
      </select>
    </div>
    <!-- NEW FIRMWARE VERSION FIELD -->
    <div class="form-group col-md-4">
      <label for="firmwareVersion">Firmware Version</label>
      <input type="text" id="firmwareVersion" name="firmwareVersion" class="form-control" placeholder="e.g. V2 11.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-3">
      <label for="led">LED R/G/B</label>
      <select id="led" name="led" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
    <div class="form-group col-md-3">
      <label for="buzzer">BUZZER</label>
      <select id="buzzer" name="buzzer" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
    <div class="form-group col-md-3">
      <label for="haptic1">HAPTIC1</label>
      <select id="haptic1" name="haptic1" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
    <div class="form-group col-md-3">
      <label for="haptic2">HAPTIC2</label>
      <select id="haptic2" name="haptic2" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="strGauge">STR GAUGE</label>
      <select id="strGauge" name="strGauge" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
    <div class="form-group col-md-4">
      <label for="charge">CHARGE</label>
      <select id="charge" name="charge" class="form-control">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
    <div class="form-group col-md-4">
      <label for="result">RESULT</label>
      <select id="result" name="result" class="form-control" required>
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="calibratedStrain1">Calibrated Strain Reading</label>
      <input type="text" id="calibratedStrain1" name="calibratedStrain1" class="form-control">
    </div>
    <div class="form-group col-md-4">
      <label for="tenLb">10 LB</label>
      <input type="text" id="tenLb" name="tenLb" class="form-control">
    </div>
    <div class="form-group col-md-4">
      <label for="calibratedStrain2">Calibrated Strain Reading .1</label>
      <input type="text" id="calibratedStrain2" name="calibratedStrain2" class="form-control">
    </div>
  </div>

  <div class="form-group">
    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" class="form-control" rows="2"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Submit Bench Test</button>
</form>

<script>
function handleFormSubmit(event) {
  event.preventDefault();
  
  const handleData = {
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    serialNo: document.getElementById('serialNo').value,
    macId: document.getElementById('macId').value,
    extremity: document.getElementById('extremity').value,
    side: document.getElementById('side').value,
    led: document.getElementById('led').value,
    buzzer: document.getElementById('buzzer').value,
    haptic1: document.getElementById('haptic1').value,
    haptic2: document.getElementById('haptic2').value,
    strGauge: document.getElementById('strGauge').value,
    charge: document.getElementById('charge').value,
    result: document.getElementById('result').value,
    comments: document.getElementById('comments').value,
    calibratedStrain1: document.getElementById('calibratedStrain1').value,
    tenLb: document.getElementById('tenLb').value,
    calibratedStrain2: document.getElementById('calibratedStrain2').value,
    firmwareVersion: document.getElementById('firmwareVersion').value // Payload inclusion
  };

  google.script.run
    .withSuccessHandler(function(response) {
      alert("Handle Testing Data submitted successfully!");
      document.getElementById('handleTestingForm').reset();
    })
    .withFailureHandler(function(error) {
      alert("Error submitting form: " + error.message);
    })
    .processHandleTestingSubmission(handleData);
}
</script>
